<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Домашняя видеотека</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet" crossorigin="anonymous"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB">
</head>
<body>
<main class="container py-4">
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
  <h1 class="h3 mb-0">Домашняя видеотека</h1>
  <a href="/docs/">Документация API (Swagger)</a>
</div>
<p class="text-body-secondary small">Учебные записи. После перезапуска сервиса список восстанавливается.</p>
<form id="film-form" class="border rounded bg-light p-3">
  <fieldset>
    <legend id="form-title" class="h5 mb-3">Добавить фильм</legend>
    <div class="row g-3">
      <label class="col-md-4">Название
        <input class="form-control mt-1" name="title" required maxlength="100"></label>
      <label class="col-md-2 col-sm-6">Жанр
        <input class="form-control mt-1" name="genre" required maxlength="40"></label>
      <label class="col-md-2 col-sm-6">Год
        <input class="form-control mt-1" name="year" type="number" min="1888" max="2100" required></label>
      <label class="col-md-2 col-sm-6">Минуты
        <input class="form-control mt-1" name="duration" type="number" min="1" max="1000" required></label>
      <label class="col-md-2 col-sm-6">Оценка
        <input class="form-control mt-1" name="rating" type="number" min="0" max="10" step="0.1" required></label>
    </div>
    <div class="d-flex gap-2 mt-3">
      <button class="btn btn-primary" type="submit">Сохранить</button>
      <button class="btn btn-outline-secondary" type="button" id="cancel">Отмена</button>
    </div>
  </fieldset>
</form>
<p id="message" role="status" class="my-2"></p>
<div class="d-flex flex-wrap align-items-end gap-3 my-3">
<label>Сортировать по <select id="sort" class="form-select mt-1">
  <option value="id">Номеру</option><option value="title">Названию</option>
  <option value="genre">Жанру</option><option value="year">Году</option>
  <option value="duration">Длительности</option><option value="rating">Оценке</option>
</select></label>
<label>Порядок <select id="order" class="form-select mt-1"><option value="asc">По возрастанию</option><option value="desc">По убыванию</option></select></label>
<button id="refresh" class="btn btn-outline-secondary">Обновить</button>
</div>
<div class="table-responsive"><table class="table table-bordered table-striped table-hover align-middle">
  <thead class="table-light"><tr><th>№</th><th>Название</th><th>Жанр</th><th>Год</th><th>Минуты</th><th>Оценка</th><th>Действия</th></tr></thead>
  <tbody id="films"></tbody>
</table></div>
<section class="border-top pt-3 mt-2">
<h2 class="h5">Статистика</h2>
<label>Поле <select id="field" class="form-select mt-1"><option value="duration">Длительность</option><option value="year">Год</option><option value="rating">Оценка</option><option value="id">Номер</option></select></label>
<p id="stats" class="mt-3 mb-0"></p>
</section>
</main>
<script src="/static/main.js"></script>
</body>
</html>
